<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>NDVI Timeseries Explorer</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
    }

    .map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: lightblue;
    }

    #build-version {
      position: absolute;
      left: 8px;
      bottom: 4px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      color: rgba(0, 0, 0, 0.35);
      pointer-events: none;
      z-index: 1;
    }

    #login-container {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
    }

    #login-button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: white;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: hidden;
    }

    #login-button img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    #login-button svg {
      color: #666;
    }

    #draw-toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      display: flex;
      gap: 8px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      padding: 6px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #draw-toolbar button {
      display: flex;
      align-items: center;
      gap: 6px;
      border: none;
      background: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
      color: #444;
      cursor: pointer;
    }

    #draw-toolbar button:hover {
      background: #f2f2f2;
    }

    #draw-toolbar button.active {
      background: rgba(107, 155, 94, 0.18);
      color: #3d6b2c;
    }

    #draw-toolbar button:disabled {
      color: #bbb;
      cursor: not-allowed;
      background: none;
    }

    #ndvi-panel {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 460px;
      max-width: calc(100vw - 40px);
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      padding: 14px 18px 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 10;
      box-sizing: border-box;
    }

    #ndvi-panel.visible {
      display: block;
    }

    #ndvi-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    #ndvi-panel-title {
      font-size: 13px;
      font-weight: 600;
      color: #222;
    }

    #ndvi-panel-close {
      border: none;
      background: none;
      font-size: 18px;
      line-height: 1;
      color: #888;
      cursor: pointer;
      padding: 2px;
    }

    #ndvi-panel-close:hover {
      color: #333;
    }

    #ndvi-panel-body {
      min-height: 40px;
    }

    #ndvi-status {
      font-size: 12px;
      color: #888;
      padding: 10px 0;
    }

    #ndvi-status.error {
      color: #c0605c;
    }

    #ndvi-chart {
      display: block;
      width: 100%;
      height: auto;
    }

    #ndvi-chart .ndvi-bar {
      fill: #6b9b5e;
    }

    #ndvi-chart .ndvi-axis {
      stroke: #ccc;
      stroke-width: 1;
    }

    #ndvi-chart .ndvi-gridline {
      stroke: #eee;
      stroke-width: 1;
    }

    #ndvi-chart text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      fill: #888;
    }

    #ndvi-chart .ndvi-value-label {
      font-size: 9px;
      fill: #555;
      font-weight: 600;
    }
  </style>
  <script type="module" crossorigin src="/web_apps/openlayers/zarr_ndvi/dist/assets/index-Blje-J-s.js"></script>
  <link rel="stylesheet" crossorigin href="/web_apps/openlayers/zarr_ndvi/dist/assets/index-CmhLOP92.css">
</head>

<body>
  <div class="map" id="map"></div>
  <div id="build-version"></div>

  <div id="draw-toolbar">
    <button id="draw-button" type="button" title="Draw a polygon to sample NDVI">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3l4 18 5-7 7-5z"></path>
      </svg>
      Draw polygon
    </button>
    <button id="clear-button" type="button" title="Clear the drawn polygon" disabled>Clear</button>
  </div>

  <div id="login-container">
    <button id="login-button">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
    </button>
  </div>

  <div id="ndvi-panel">
    <div id="ndvi-panel-header">
      <span id="ndvi-panel-title">NDVI timeseries</span>
      <button id="ndvi-panel-close" title="Close" aria-label="Close">&times;</button>
    </div>
    <div id="ndvi-panel-body">
      <div id="ndvi-status"></div>
    </div>
  </div>

</body>

</html>
