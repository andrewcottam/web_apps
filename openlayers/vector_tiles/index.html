<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Restor Sites as Vector Tiles</title>
  <link rel="stylesheet" href="node_modules/ol/ol.css">
  <style>
    .map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: lightblue;
    }

    .map_container {
      width: 100%;
      height: 100%;
    }

    #slider-container {
      position: absolute;
      top: 10px;
      left: 43px;
      background: white;
      padding: 10px;
      border-radius: 5px;
    }

    #popup {
      position: relative;
      width: 280px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      padding: 14px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      pointer-events: none;
    }

    #popup .popup-flag {
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: 20px;
      line-height: 1;
    }

    #popup .popup-title {
      font-size: 15px;
      font-weight: 600;
      color: #222;
      margin: 0 0 6px 0;
      padding-right: 26px;
      line-height: 1.3;
      overflow-wrap: break-word;
    }

    #popup .popup-badges {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    #popup .popup-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #3d6b2c;
      background: rgba(99, 148, 69, 0.15);
      border-radius: 4px;
      padding: 2px 6px;
    }

    #popup .popup-badge.visibility-private {
      color: #a15c00;
      background: rgba(244, 160, 0, 0.15);
    }

    #popup .popup-check-pills {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }

    #popup .popup-check-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      color: white;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    #popup dl.popup-fields {
      margin: 0;
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 10px;
      row-gap: 4px;
      font-size: 12px;
    }

    #popup dl.popup-fields dt {
      color: #888;
      white-space: nowrap;
    }

    #popup dl.popup-fields dd {
      margin: 0;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #login-container {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
    }

    #login-button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: white;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: hidden;
    }

    #login-button img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    #login-button svg {
      color: #666;
    }

    #checks-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    #checks-modal-backdrop.open {
      display: flex;
    }

    #checks-modal {
      width: 420px;
      max-width: 90vw;
      max-height: 80vh;
      background: white;
      border-radius: 10px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.25);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #checks-modal .checks-modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid #eee;
    }

    #checks-modal .checks-modal-title {
      font-size: 16px;
      font-weight: 600;
      color: #222;
      overflow-wrap: break-word;
    }

    #checks-modal .checks-modal-close {
      border: none;
      background: none;
      font-size: 20px;
      line-height: 1;
      color: #888;
      cursor: pointer;
      padding: 2px;
      flex-shrink: 0;
    }

    #checks-modal .checks-modal-close:hover {
      color: #333;
    }

    #checks-modal .checks-modal-body {
      padding: 8px 18px 18px;
      overflow-y: auto;
    }

    #checks-modal .check-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #f2f2f2;
    }

    #checks-modal .check-row:last-child {
      border-bottom: none;
    }

    #checks-modal .check-info {
      min-width: 0;
    }

    #checks-modal .check-name {
      font-size: 13px;
      font-weight: 600;
      color: #222;
    }

    #checks-modal .check-message {
      font-size: 12px;
      color: #777;
      margin-top: 2px;
    }

    #checks-modal .check-status-pill {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 9px;
      border-radius: 999px;
      color: white;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    #checks-modal .checks-modal-empty {
      font-size: 13px;
      color: #888;
      padding: 12px 0;
    }

    .lightbox2 {
      font-size: 14px;
      color: gray;
      background: white;
      padding: 10px;
      border-radius: 10px;
      /* Optional: smooth corners */
      box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
      /* Soft light shadow */
      transition: box-shadow 0.3s ease-in-out;
      /* Smooth effect */
    }

  </style>
</head>

<body>
  <div class="map_container">
    <div id="map" class="map"></div>
  </div>
  <div id="slider-container" class="lightbox2">
    <label for="slider">Site area threshold in Km2</label>
    <input type="range" id="slider" min="0" max="1000000" value="2000">
    <span id="slider-value">2000</span>
    <div>
      <span></span>
      <label><input type="radio" name="options" value="PRIVATE">Private</label>
      <label><input type="radio" name="options" value="PUBLIC" checked>Public</label><br></span>
    </div>
  </div>
  <div id="popup">
  </div>
  <div id="login-container">
    <button id="login-button" title="Login">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
    </button>
  </div>
  <div id="checks-modal-backdrop">
    <div id="checks-modal">
      <div class="checks-modal-header">
        <div class="checks-modal-title" id="checks-modal-title"></div>
        <button class="checks-modal-close" id="checks-modal-close" title="Close" aria-label="Close">&times;</button>
      </div>
      <div class="checks-modal-body" id="checks-modal-body"></div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
<!-- Use Option + SHIFT to rotate -->

</html>
