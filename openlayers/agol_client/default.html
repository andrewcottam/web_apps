<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@9/dist/ol.js"></script>
  <style> #map { width: 100%; height: 100vh; margin: 0; padding: 0; } </style>
</head>
<body>
<div id="map"></div>
<script>
const WMTS_URL = 'https://tiles-eu1.arcgis.com/GS4R6nt5gxQK4Sbv/arcgis/rest/services/Tahi_Pleiades_Image_09th_April_2025/MapServer/WMTS';
// to get a token open the image in arcis online and add it to the map then go to the network tab, filter for https://tiles-eu1.arcgis.com/GS4R6nt5gxQK4Sbv/arcgis/rest/services/
// and copy the token value
const TOKEN = 'alPMkXKoAWtnGSU_Rvye5qQ..KsR-CiSJgoIwbr8nQ3RGFI3qlRjzgY8_dgYtW1LzY9wfURwKkpXAo9RCfqDmjPjE25jvgBKPKcJkXvJW5u7vHTSd7tBIocowXu-JLRyUaKMDF_1Gb41GVCksadLp--8Pq66Xr320v1ob-JawPxqyCfHKjYR-Fw1xdNWltYPKnCiKFVYDu5AmreKUmbT4KOBMQOLv62oPjaYsWkGWlGTU4yWkV3vUD9jh3NpGdzs45z3Iu2NQbPaAxxfKFOeXi6RN7DtW5TUXZcNVO54qXjCsFGkmghpnJLn71JWagBCxbC3jqa57Ws2c9026KedPINSCT3sRZYc6K-qGVPElSuq0v_R_MC8Wn1qU8oM.';

fetch(`${WMTS_URL}/1.0.0/WMTSCapabilities.xml?token=${TOKEN}`)
  .then(r => r.text())
  .then(text => {
    const parser = new ol.format.WMTSCapabilities();
    const caps = parser.read(text);

    console.log('Full capabilities:', JSON.stringify(caps, null, 2));

    const layer = caps.Contents.Layer[0].Identifier;
    const matrixSet = caps.Contents.TileMatrixSet[0].Identifier;
    console.log('Layer identifier:', layer);
    console.log('MatrixSet identifier:', matrixSet);

    const options = ol.source.WMTS.optionsFromCapabilities(caps, {
      layer,
      matrixSet,
    });

    // Append token to tile URLs
    options.urls = options.urls.map(u => `${u}?token=${TOKEN}`);

    const map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.Tile({
          source: new ol.source.OSM()  // basemap for context
        }),
        new ol.layer.Tile({
          source: new ol.source.WMTS(options)
        })
      ],
      view: new ol.View({
        projection: 'EPSG:3857',
        center: [19427518, -4261494],
        zoom: 16
      })
    });
  })
  .catch(err => {
    console.error('Failed to load WMTS capabilities:', err);
  });
</script>
</body>
</html>
