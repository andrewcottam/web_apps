<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Tahi Tree Crowns</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoiYW5kcmV3Y290dGFtIiwiYSI6ImNsY3N4aHM5czB1YjkzbmxoNzN1NHk3aGYifQ.LzpyM7lJ5-f0vjshJoaNXg';
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/light-v11',
            zoom: 17,
            maxZoom: 22,
            center: [174.49608, -35.70818]
        });
        map.on('load', () => {
            map.addSource('vector-tiles-source', {
                type: 'vector',
                maxzoom: 20,
                tiles: [
                    'https://storage.googleapis.com/restor-tree-detection-vector-tiles/andrew@restor.eco/ri17pJwRBKiKhkOPmK3L/cbfbf0ba-d010-473a-bae9-d9399bfd9290/{z}/{x}/{y}.pbf'
                ],
            });
            map.addLayer({
                id: 'tahi_tms_tiles',
                type: 'raster',
                maxzoom: 23,
                source: {
                    type: 'raster',
                    scheme: "tms",
                    tiles: ['https://storage.googleapis.com/restor-imagery-tms/andrew@restor.eco/ri17pJwRBKiKhkOPmK3L/Tahi_transparent_mosaic_group1/{z}/{x}/{y}.png'],
                    tileSize: 256
                }
            });
            map.addLayer(
                {
                    id: 'vector-tiles-layer',
                    type: 'line',
                    maxzoom: 23,
                    source: 'vector-tiles-source',
                    'source-layer': 'mvt_tiles',
                    paint: { 'line-color': 'red', 'line-width': 1.5 },
                }
            );
        });
    </script>

</body>

</html>
