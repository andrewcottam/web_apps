<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Site Verification API — Playground</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="./favicon-16x16.png" sizes="16x16" />
  <link rel="stylesheet" href="./swagger-ui.css" />
  <style>
    :root {
      --accent: #1F6F54;
      --accent-soft: #E4F0EA;
      --ink: #1C2620;
    }
    html, body { margin: 0; background: #FAFAF7; }
    .topbar {
      background: #12160F;
      color: #E7ECE6;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    }
    .topbar .mark {
      width: 24px; height: 24px; border-radius: 6px;
      background: var(--accent); flex-shrink: 0;
    }
    .topbar .title { font-size: 14px; font-weight: 650; }
    .topbar .sub { font-size: 12px; color: #A2AEA5; margin-left: 4px; }
    .swagger-ui .topbar { display: none; } /* hide swagger-ui's own topbar, we render our own above */
    .swagger-ui .btn.authorize { border-color: var(--accent); color: var(--accent); }
    .swagger-ui .btn.authorize svg { fill: var(--accent); }
    .swagger-ui .opblock.opblock-post { background: var(--accent-soft); border-color: var(--accent); }
    .swagger-ui .opblock.opblock-post .opblock-summary-method { background: var(--accent); }
    #swagger-ui { max-width: 960px; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="mark"></div>
    <span class="title">Restor API</span>
    <span class="sub">Site Verification Playground</span>
  </div>
  <div id="swagger-ui"></div>

  <script src="./swagger-ui-bundle.js"></script>
  <script src="./swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: "./openapi.yaml",
        dom_id: "#swagger-ui",
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        plugins: [SwaggerUIBundle.plugins.DownloadUrl],
        layout: "StandaloneLayout",
        deepLinking: true,
        tryItOutEnabled: true,
        docExpansion: "list",
      });
    };
  </script>
</body>
</html>
